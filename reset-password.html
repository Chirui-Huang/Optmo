<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reset your OPTMO account password">
    <title>Reset Password - OPTMO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body {
            background: linear-gradient(135deg, var(--neutral-light) 0%, var(--white) 100%);
            min-height: 100vh;
        }

        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 80px);
            padding: 40px 20px;
        }

        .auth-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 420px;
            width: 100%;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 26px;
        }

        .auth-header h1 {
            font-size: 28px;
            color: var(--text-dark);
            margin: 0 0 8px 0;
        }

        .auth-header p {
            color: var(--text-light);
            margin: 0;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--neutral-border);
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }

        .auth-btn {
            width: 100%;
            padding: 12px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }

        .auth-btn:hover {
            background: var(--primary-dark);
        }

        .message {
            font-size: 13px;
            margin-bottom: 16px;
            padding: 10px;
            border-radius: 4px;
            display: none;
            border-left: 3px solid;
        }

        .message.error {
            color: #dc2626;
            background: rgba(220, 38, 38, 0.1);
            border-left-color: #dc2626;
        }

        .message.success {
            color: #047857;
            background: rgba(16, 185, 129, 0.1);
            border-left-color: #10b981;
        }

        .message.show {
            display: block;
        }

        .auth-footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--neutral-border);
            font-size: 14px;
            color: var(--text-light);
        }

        @media (max-width: 768px) {
            .auth-card {
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <main class="main-content">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <h1>Reset Password</h1>
                    <p>Enter your email to receive a reset link</p>
                </div>

                <form id="resetForm">
                    <div id="message" class="message"></div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="your@email.com" required>
                    </div>

                    <button type="submit" class="auth-btn" id="resetBtn">
                        <i class="fas fa-key"></i> Send Reset Email
                    </button>
                </form>

                <div class="auth-footer">
                    Remember your password? <a href="login.html">Back to login</a>
                </div>
            </div>
        </div>
    </main>

    <script src="js/main.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/pocketbase@0.21.0/dist/pocketbase.umd.js" defer></script>
    <script src="js/pocketbase-client.js" defer></script>
    <script>
        document.getElementById('resetForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const messageEl = document.getElementById('message');
            const resetBtn = document.getElementById('resetBtn');

            messageEl.className = 'message';

            if (!email) {
                messageEl.textContent = 'Please enter your email address.';
                messageEl.classList.add('error', 'show');
                return;
            }

            resetBtn.disabled = true;
            resetBtn.textContent = 'Sending...';

            try {
                if (typeof initPocketBase === 'function') {
                    initPocketBase();
                }
                if (!pb) {
                    throw new Error('Authentication service is not available right now.');
                }

                await pb.collection('users').requestPasswordReset(email);
                messageEl.textContent = 'If this email exists, a reset link has been sent.';
                messageEl.classList.add('success', 'show');
            } catch (error) {
                messageEl.textContent = error.message || 'Could not send reset email.';
                messageEl.classList.add('error', 'show');
            } finally {
                resetBtn.disabled = false;
                resetBtn.innerHTML = '<i class="fas fa-key"></i> Send Reset Email';
            }
        });
    </script>
</body>
</html>
