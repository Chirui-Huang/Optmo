<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create an OPTMO account">
    <title>Sign Up - OPTMO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body {
            background: linear-gradient(135deg, var(--neutral-light) 0%, var(--white) 100%);
            min-height: 100vh;
        }

        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 80px);
            padding: 40px 20px;
        }

        .auth-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 420px;
            width: 100%;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-header h1 {
            font-size: 28px;
            color: var(--text-dark);
            margin: 0 0 8px 0;
        }

        .auth-header p {
            color: var(--text-light);
            margin: 0;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--neutral-border);
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }

        .auth-btn {
            width: 100%;
            padding: 12px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }

        .auth-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .error-message {
            color: #dc2626;
            font-size: 13px;
            margin-bottom: 16px;
            padding: 10px;
            background: rgba(220, 38, 38, 0.1);
            border-radius: 4px;
            border-left: 3px solid #dc2626;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .auth-footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--neutral-border);
            font-size: 14px;
            color: var(--text-light);
        }

        @media (max-width: 768px) {
            .auth-card {
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <main class="main-content">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <h1>Create Account</h1>
                    <p>Sign up for your OPTMO account</p>
                </div>

                <form id="signupForm">
                    <div id="errorMessage" class="error-message"></div>

                    <div class="form-group">
                        <label for="displayName">Display Name</label>
                        <input type="text" id="displayName" placeholder="Your name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="your@email.com" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="At least 8 characters" minlength="8" required>
                    </div>

                    <button type="submit" class="auth-btn" id="signupBtn">
                        <i class="fas fa-user-plus"></i> Create Account
                    </button>
                </form>

                <div class="auth-footer">
                    Already have an account? <a href="login.html">Log in</a>
                </div>
            </div>
        </div>
    </main>

    <script src="js/main.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/pocketbase@0.21.0/dist/pocketbase.umd.js" defer></script>
    <script src="js/pocketbase-client.js" defer></script>
    <script>
        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const displayName = document.getElementById('displayName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            const submitBtn = document.getElementById('signupBtn');

            errorDiv.classList.remove('show');
            errorDiv.style.borderLeftColor = '#dc2626';
            errorDiv.style.backgroundColor = 'rgba(220, 38, 38, 0.1)';
            errorDiv.style.color = '#dc2626';

            if (!displayName || !email || !password) {
                errorDiv.textContent = 'Please fill in all fields.';
                errorDiv.classList.add('show');
                return;
            }

            if (password.length < 8) {
                errorDiv.textContent = 'Password must be at least 8 characters.';
                errorDiv.classList.add('show');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating account...';

            try {
                const result = await signUpUser(email, password, displayName);

                if (!result.success) {
                    throw new Error(result.error || 'Sign up failed.');
                }

                errorDiv.textContent = 'Account created successfully! Redirecting...';
                errorDiv.style.borderLeftColor = '#10b981';
                errorDiv.style.backgroundColor = 'rgba(16, 185, 129, 0.1)';
                errorDiv.style.color = '#047857';
                errorDiv.classList.add('show');

                setTimeout(() => {
                    window.location.href = 'account.html';
                }, 900);
            } catch (error) {
                errorDiv.textContent = error.message || 'Unable to create account.';
                errorDiv.classList.add('show');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
            }
        });
    </script>
</body>
</html>
